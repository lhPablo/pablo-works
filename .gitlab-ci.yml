stages:
  - verify

default:
  image: node:26-alpine
  before_script:
    - npm install -g pnpm@11.6.0
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

build:
  stage: verify
  script:
    - pnpm build

lint:
  stage: verify
  script:
    - pnpm lint

typecheck:
  stage: verify
  script:
    - pnpm check
